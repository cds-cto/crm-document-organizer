version: "3.9"

services:
  app:
    build: .
    container_name: document_organizer
    working_dir: /code
    # command: uvicorn src.main:app --host 0.0.0.0 --port 80 --workers 4
    # command: uvicorn src.main:app --host 0.0.0.0 --port 80 --reload
    command: python -u -m src.main
    ports:
      - 80:80        # not used by the script; safe to remove if you like
      - 5679:5679    # keep if you attach a debugger
    volumes:
      - .:/code
    dns:
      - 8.8.8.8
    # no restart policy: container exits when the flow finishes

# detach mode + rebuild : docker compose up --build -d
# check live : docker ps -a
# go do detach mode, open IDE and debug
# docker-compose up --build
