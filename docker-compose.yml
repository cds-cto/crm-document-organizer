version: "3.12.7"

services:
  app:
    container_name: document_organizer
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    working_dir: /code
    # Use the Dockerfile's CMD: ["python", "./src/main.py"]
    # (remove the command override)
    # command: ["python", "-u", "-m", "src.main"]  # <-- delete this line
    volumes:
      - .:/code
    ports:
      - "5679:5679"
    environment:
      - PYTHONUNBUFFERED=1
    dns:
      - 8.8.8.8


    # no restart policy: container exits when the flow finishes

# detach mode + rebuild : docker compose up --build -d
# check live : docker ps -a
# go do detach mode, open IDE and debug
# docker-compose up --build
